name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Needs native TypeScript type stripping for the migration and experiment scripts.
          node-version: 24
          cache: npm

      - name: Create databases
        # The connection URLs are literals without credentials, so the role has to match
        # the OS user the job runs as.
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE runner SUPERUSER LOGIN"
          createdb -h 127.0.0.1 -U postgres -O runner jm_booking
          createdb -h 127.0.0.1 -U postgres -O runner jm_booking_test

      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run check
      - run: npm run build
